# Site numbers come from the claims register in bawbel/.github (scripts/sync_site_numbers.py).
# On a pull request: fail if the stat block is stale or a count is typed outside it.
# Weekly and on demand: regenerate the block and open a pull request against develop.
name: site numbers

on:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m pytest tests -q
      - run: python scripts/sync_site_numbers.py --check

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/sync_site_numbers.py
      - name: Open a pull request when the numbers changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Stat block already current."
            exit 0
          fi
          if [ -n "$(gh pr list --base develop --state open --search 'head:chore/site-numbers-' --json number --jq '.[].number')" ]; then
            echo "A site-numbers pull request is already open."
            exit 0
          fi
          branch="chore/site-numbers-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -s -am "chore: sync site numbers from the claims register"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "chore: sync site numbers from the claims register" \
            --body "Generated by scripts/sync_site_numbers.py from claims/register.yaml in bawbel/.github. Review the new values against that register before merging."
